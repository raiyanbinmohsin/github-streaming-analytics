x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /app
  volumes:
    - ./results:/results
  env_file:
    - .env
  environment:
    - PYTHONUNBUFFERED=1
  depends_on:
    pulsar:
      condition: service_healthy
  restart: unless-stopped

services:
  pulsar:
    image: apachepulsar/pulsar:3.3.1
    container_name: pulsar-broker
    command: ["bin/pulsar", "standalone"]
    ports:
      - "6650:6650"
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "bin/pulsar-admin brokers healthcheck > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  producer:
    <<: *python-service
    container_name: github-producer
    command: ["python", "main.py", "--service", "producer"]

  consumer-language-stats:
    <<: *python-service
    container_name: consumer-language-stats
    command: ["python", "main.py", "--service", "consumer-language-stats"]

  consumer-unit-test-analysis:
    <<: *python-service
    container_name: consumer-unit-test-analysis
    command: ["python", "main.py", "--service", "consumer-unit-test-analysis"]

  consumer-ci-devops-analysis:
    <<: *python-service
    container_name: consumer-ci-devops-analysis
    command: ["python", "main.py", "--service", "consumer-ci-devops-analysis"]
